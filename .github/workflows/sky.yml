# 🛰️ The real sky calendar: the ISS's next two days over the ground (scripts/iss-track.mjs), every 6 hours.
name: Sky
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: sky
  cancel-in-progress: false
jobs:
  iss:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: The ISS's track
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ojxqarpmreekylwotbdb
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::SUPABASE_ACCESS_TOKEN secret is missing"; exit 0; fi
          # (SGP4 from satellite.js, installed beside the script only — not into the game)
          mkdir -p "$RUNNER_TEMP/sky" && cp scripts/iss-track.mjs "$RUNNER_TEMP/sky/" && cd "$RUNNER_TEMP/sky"
          npm init -y > /dev/null && npm install --no-audit --no-fund satellite.js@5
          node iss-track.mjs
