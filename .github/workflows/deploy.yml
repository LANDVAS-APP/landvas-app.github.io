# Deploys LANDVAS on every push to the `source` branch:
#   1. database migrations  (Supabase Management API, needs secret SUPABASE_ACCESS_TOKEN)
#   2. Edge Functions        (minigame validation + art pipeline)
#   3. the web app           (built into the `main` branch, which GitHub Pages serves)
name: Deploy LANDVAS
on:
  push:
    branches: [source]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: deploy
  cancel-in-progress: false
env:
  SUPABASE_PROJECT_REF: ojxqarpmreekylwotbdb
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npx vitest run tests/unit
      - name: Database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::SUPABASE_ACCESS_TOKEN secret is missing — skipping database deploy"; exit 0; fi
          node scripts/deploy-db.mjs
      - name: Auth settings (site address, sign-in redirects)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::SUPABASE_ACCESS_TOKEN secret is missing — skipping auth settings"; exit 0; fi
          if [ -f deploy/CNAME ]; then export SITE_URL="https://$(tr -d ' \r\n' < deploy/CNAME)"; else export SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io"; fi
          export EXTRA_ORIGINS="https://${GITHUB_REPOSITORY_OWNER,,}.github.io,https://landvas.app,https://www.landvas.app"
          node scripts/configure-auth.mjs || echo "::warning::could not update auth settings"
      - name: Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::SUPABASE_ACCESS_TOKEN secret is missing — skipping functions"; exit 0; fi
          node scripts/build-functions.mjs
          for fn in minigame-finish pipeline; do
            npx supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api \
              || npx supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          done
      - name: Build web app
        run: |
          export LANDVAS_BUILD_ID="${GITHUB_SHA::7}"
          npx vite build --mode production
          printf '{"build":"%s","at":"%s"}\n' "$LANDVAS_BUILD_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.json
      - name: Publish to GitHub Pages (main branch)
        run: |
          bash deploy/spa-fallback.sh dist
          touch dist/.nojekyll
          # custom domain (GitHub Pages reads the CNAME file from the published branch)
          if [ -f deploy/CNAME ]; then cp deploy/CNAME dist/CNAME; fi
          # landvas.app (Cloudflare Workers Builds, static assets) rejects _redirects; the
          # per-route folders made by spa-fallback.sh already cover every app address there
          rm -f dist/_redirects
          cd dist
          git init -q -b main
          git config user.name "LANDVAS deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" main
